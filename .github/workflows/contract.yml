# Contract gates — plane 1 of the contract ADR.
#
# Copied to .github/workflows/contract.yml by `setup` when the repo opts into the contract
# layer. Deliberately scoped to the contract gates ONLY: build/test CI is a separate
# concern and is not bundled here.
#
# Every gate is a no-op-with-reason until game-server/api-gateway/openapi.yaml exists. It reports SKIPPED explicitly
# rather than passing vacuously — a green check that means "nothing ran" is worse than no
# check, because it is trusted.
#
# PLACEHOLDERS: game-server/api-gateway game-client/src/api/generated game-server/api-gateway/openapi.yaml game-server/.oasdiff-ignore
#               game-server/.spectral.yaml

name: contract

on:
  pull_request:
    paths:
      - "game-server/api-gateway/**"
      - "game-client/src/api/generated/**"
      - "game-server/.spectral.yaml"
      - "game-server/.oasdiff-ignore"
      - "contract-fixtures/**"
      - ".github/workflows/contract.yml"
  push:
    branches: [main]

jobs:
  plane1:
    name: plane 1 (HTTP contract)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # oasdiff diffs against the base branch's committed spec, so the gate needs
          # history, not just the tip commit.
          fetch-depth: 0

      # — e.g. actions/setup-go with go-version-file, or setup-java, etc.
      - uses: actions/setup-go@v5
        with:
          go-version-file: game-server/api-gateway/go.mod
          cache-dependency-path: game-server/api-gateway/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The regenerate step is only meaningful if the dependency graph is verifiable.
      # Lockfiles MUST be committed for this to mean anything — a repo that gitignores
      # them cannot make the reproducibility promise this gate assumes.
      - name: verify module graph
        working-directory: game-server/api-gateway
        run: go mod verify

      # FS-0001 I-0007. Deliberately ahead of the spec gates: it needs no
      # generated artifact, so it can fail on a tree that has no openapi.yaml —
      # which is every tree until the first endpoint is serialized. The gates
      # below correctly SKIP until then; this one does not, and must not.
      - name: error seam gates
        working-directory: game-server
        run: ./scripts/check-seam.sh

      # The gate's own test. A check nobody has watched fail is configuration,
      # not enforcement.
      - name: error seam gates — selftest
        working-directory: game-server
        run: ./scripts/seam-gate-selftest.sh

      # Like the seam gate, needs no generated artifact. Catches two host-port
      # failures that already happened: two services binding one port, and a
      # per-service compose file drifting from the root aggregate.
      - name: compose port clash gate
        working-directory: game-server
        run: ./scripts/check-compose-clashes.sh

      - name: regenerate spec and fail on diff
        working-directory: game-server/api-gateway
        run: make openapi-diff

      - name: lint contract depth (spectral)
        working-directory: game-server/api-gateway
        run: make lint-contract

      # Installs the PINNED oasdiff binary as a prerequisite; see the Makefile.
      - name: breaking-change check (oasdiff)
        working-directory: game-server/api-gateway
        run: make openapi-breaking

      # The generated client is the consumer's only import path for serialized endpoints.
      # If regenerating it produces a diff, the committed client is stale.
      - name: lint fence — no hand-written fetch (selftest)
        working-directory: game-client
        run: npm ci && npm run lint:fence

      - name: client typecheck
        working-directory: game-client
        run: npx tsc --noEmit

      - name: regenerate client and fail on diff
        run: |
          make -C game-server/api-gateway client
          if ! git diff --quiet -- game-client/src/api/generated; then
            echo "::error::generated client is stale — run 'make -C game-server/api-gateway client' and commit"
            git diff --stat -- game-client/src/api/generated
            exit 1
          fi
          echo "✅ generated client matches committed"
