apiVersion: apps/v1
kind: Deployment
metadata: { name: character }
spec:
  replicas: 1
  selector: { matchLabels: { app: character } }
  template:
    metadata: { labels: { app: character } }
    spec:
      containers:
        - name: character
          image: character:dev
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 7123, name: grpc }]
          envFrom:
            - configMapRef: { name: character }
            - secretRef: { name: character }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata: { name: character }
spec:
  selector: { app: character }
  ports: [{ port: 7123, targetPort: grpc }]
---
apiVersion: v1
kind: Service
metadata: { name: character-headless }
spec:
  clusterIP: None
  selector: { app: character }
  ports: [{ port: 7123, targetPort: grpc }]
