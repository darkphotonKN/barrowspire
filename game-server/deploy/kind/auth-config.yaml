# what to tell the process
# .env of the k8s
# ConfigMap for plain values, Secret for sensitive ones
apiVersion: v1
kind: ConfigMap
metadata: { name: auth }
data:
  SERVICE_VERSION: "1.0.0"
  ENVIRONMENT: "DEVELOPMENT"
  GRPC_AUTH_ADDR: "7116"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "barrowspire_auth_service_db"
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"
  OTEL_ENABLED: "false"
  AWS_REGION: "us-east-1"
  S3_BUCKET_NAME: "barrowspire-auth-uploads-dev"
  CDN_URL: ""
