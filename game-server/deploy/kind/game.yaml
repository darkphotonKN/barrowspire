apiVersion: v1
kind: Service
metadata: { name: game-headless }
spec:
  clusterIP: None
  selector: { app: game }
  ports: [{ name: ws, port: 5668 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: game }
spec:
  serviceName: game-headless # gives pods DNS: game-0.game-headless
  replicas: 3
  selector: { matchLabels: { app: game } }
  template:
    metadata: { labels: { app: game } }
    spec:
      terminationGracePeriodSeconds: 330 # DRAIN_TIMEOUT 5m + 30s
      containers:
        - name: game
          image: game:dev
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 5668, name: ws }
          env:
            # different per pod, with kubelet providing information
            # so separate from envFrom config map / secrets
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } } # Downward API → game-0
          envFrom:
            - configMapRef: { name: game }
            - secretRef: { name: game }
          resources:
            requests: { cpu: 250m, memory: 128Mi }
            limits: { cpu: 250m, memory: 128Mi } # requests == limits: Guaranteed QoS
          readinessProbe:
            httpGet: { path: /api/health, port: ws }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /api/health, port: ws }
            periodSeconds: 10
