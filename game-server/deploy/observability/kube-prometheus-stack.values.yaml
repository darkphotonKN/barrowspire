# kube-prometheus-stack on GKE Autopilot (barrowspire-dev), namespace "monitoring".
#
# Install:
#   helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#     --kube-context gke_barrowspire-512613_asia-east1_barrowspire-dev -n monitoring \
#     -f deploy/observability/kube-prometheus-stack.values.yaml
#
# The Grafana admin login lives in the Secret monitoring/grafana-admin
# (keys admin-user, admin-password), created out of band. Never put it here.
#
# Autopilot notes:
# - Every container gets a small explicit request; Autopilot bills requests and
#   assigns large defaults to containers that omit them.
# - kube-system is a managed namespace (no writes), so the kubelet Service lives
#   in "monitoring" and the exporters that need a kube-system Service are off.
# - Control-plane components are not scrapeable on Autopilot.

# Not scrapeable / not allowed on Autopilot.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
coreDns:
  enabled: false
kubeDns:
  enabled: false

# hostPath/hostNetwork DaemonSet is rejected by Autopilot.
nodeExporter:
  enabled: false

kubelet:
  namespace: monitoring

prometheusOperator:
  kubeletService:
    namespace: monitoring
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
  admissionWebhooks:
    patch:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
  prometheusConfigReloader:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi

prometheus:
  prometheusSpec:
    # Pick up ServiceMonitors/PodMonitors/rules from any namespace, not only
    # ones labelled with this Helm release.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    retention: 7d
    # keep the trace_id exemplars services attach to latency histograms
    enableFeatures:
      - exemplar-storage
    # Tempo's metrics-generator pushes service-graph and span metrics here
    enableRemoteWriteReceiver: true
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

alertmanager:
  alertmanagerSpec:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
grafana:
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    size: 2Gi
  # RWO volume: a rolling update would wait on the old pod to release the disk.
  deploymentStrategy:
    type: Recreate
  # fsGroup on the pod already makes the volume writable; skip the root chown init container.
  initChownData:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
  sidecar:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
    datasources:
      # exemplar dots on Prometheus panels link to the trace in Tempo
      exemplarTraceIdDestinations:
        datasourceUid: tempo
        traceIdLabelName: trace_id
        urlDisplayLabel: View trace
  # Tempo is its own release (tempo.values.yaml). After changing this, re-run:
  #   helm upgrade kube-prometheus-stack prometheus-community/kube-prometheus-stack \
  #     --kube-context gke_barrowspire-512613_asia-east1_barrowspire-dev \
  #     -n monitoring --reuse-values -f deploy/observability/kube-prometheus-stack.values.yaml
  additionalDataSources:
    - name: Tempo
      type: tempo
      uid: tempo
      url: http://tempo.monitoring:3200
      access: proxy
      jsonData:
        # Explore's Service Graph tab reads the metrics Tempo remote-writes
        serviceMap:
          datasourceUid: prometheus
        # "Logs for this span": that service's lines within 5s either side.
        # service_name is set by Alloy (gateway -> api-gateway) to match the
        # tracer's service.name; the plain app label cannot, for the gateway.
        # filterByTraceID stays off while most log calls are not *Context ones.
        tracesToLogsV2:
          datasourceUid: loki
          spanStartTimeShift: "-5s"
          spanEndTimeShift: "5s"
          tags:
            - { key: service.name, value: service_name }
          filterByTraceID: false
          filterBySpanID: false
    - name: Loki
      type: loki
      uid: loki
      url: http://loki.monitoring:3100
      access: proxy
      jsonData:
        # trace_id=<hex> (slog text) or "trace_id":"<hex>" (wallet's JSON) on a
        # line becomes a "View trace" link. $$ keeps ${...} literal: Grafana
        # provisioning expands $VAR.
        derivedFields:
          - name: TraceID
            datasourceUid: tempo
            matcherRegex: 'trace_id"?[=:]"?(\w{32})'
            url: "$${__value.raw}"
            urlDisplayLabel: View trace
