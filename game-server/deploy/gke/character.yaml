apiVersion: apps/v1
kind: Deployment
metadata: { name: character }
spec:
  # 1: character migrates on boot, so several pods would race on the same migration
  replicas: 1
  selector: { matchLabels: { app: character } }
  template:
    metadata: { labels: { app: character } }
    spec:
      containers:
        - name: character
          image: asia-east1-docker.pkg.dev/barrowspire-512613/barrowspire/character:f9b85fe2
          ports:
            - { containerPort: 7123, name: grpc }
            - { containerPort: 8198, name: metrics }
          envFrom:
            - configMapRef: { name: character }
            - secretRef: { name: character }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 128Mi }
          # No probes yet: character does not register a gRPC health service.
---
apiVersion: v1
kind: Service
metadata:
  name: character
  labels: { app: character }
spec:
  selector: { app: character }
  ports:
    - { name: grpc, port: 7123, targetPort: grpc }
    - { name: metrics, port: 8198, targetPort: 8198 }
---
apiVersion: v1
kind: Service
metadata: { name: character-headless }
spec:
  clusterIP: None
  selector: { app: character }
  ports: [{ port: 7123, targetPort: grpc }]
