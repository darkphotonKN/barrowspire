apiVersion: apps/v1
kind: Deployment
metadata: { name: ledger }
spec:
  # 1: ledger migrates on boot, and its outbox workers would duplicate-publish
  # across replicas (known, deferred).
  replicas: 1
  selector: { matchLabels: { app: ledger } }
  template:
    metadata: { labels: { app: ledger } }
    spec:
      containers:
        - name: ledger
          image: asia-east1-docker.pkg.dev/barrowspire-512613/barrowspire/ledger:f9b85fe2
          ports:
            - { containerPort: 7129, name: grpc }
            - { containerPort: 8200, name: metrics }
          envFrom:
            - configMapRef: { name: ledger }
            - secretRef: { name: ledger }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 128Mi }
          # No probes yet: ledger does not register a gRPC health service.
---
apiVersion: v1
kind: Service
metadata:
  name: ledger
  labels: { app: ledger }
spec:
  selector: { app: ledger }
  ports:
    - { name: grpc, port: 7129, targetPort: grpc }
    - { name: metrics, port: 8200, targetPort: 8200 }
---
apiVersion: v1
kind: Service
metadata: { name: ledger-headless }
spec:
  clusterIP: None
  selector: { app: ledger }
  ports: [{ port: 7129, targetPort: grpc }]
