apiVersion: apps/v1
kind: Deployment
metadata: { name: wallet }
spec:
  # The RabbitMQ consumer and the Temporal worker share load across replicas.
  # Migrate-on-boot serialises on a postgres advisory lock. Known, deferred:
  # each replica's outbox worker can publish the same row (no SKIP LOCKED in
  # common/outbox).
  replicas: 3
  selector: { matchLabels: { app: wallet } }
  template:
    metadata: { labels: { app: wallet } }
    spec:
      containers:
        - name: wallet
          image: asia-east1-docker.pkg.dev/barrowspire-512613/barrowspire/wallet:fe192a2
          ports:
            - { containerPort: 7128, name: grpc }
          envFrom:
            - configMapRef: { name: wallet }
            - secretRef: { name: wallet }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: 500m, memory: 256Mi }
          # No probes yet: wallet does not register a gRPC health service.
---
apiVersion: v1
kind: Service
metadata: { name: wallet }
spec:
  selector: { app: wallet }
  ports: [{ port: 7128, targetPort: grpc }]
---
apiVersion: v1
kind: Service
metadata: { name: wallet-headless }
spec:
  clusterIP: None
  selector: { app: wallet }
  ports: [{ port: 7128, targetPort: grpc }]
