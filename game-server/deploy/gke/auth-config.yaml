# what to tell the process
# .env of the k8s
# ConfigMap for plain values, Secret for sensitive ones
apiVersion: v1
kind: ConfigMap
metadata: { name: auth }
data:
  SERVICE_VERSION: "1.0.0"
  ENVIRONMENT: "production"
  GRPC_AUTH_ADDR: "7116"
  DB_HOST: "10.6.0.3"
  DB_PORT: "5432"
  DB_NAME: "barrowspire_auth_service_db"
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"
  OTEL_ENABLED: "true"
  GOMEMLIMIT: "115MiB"
