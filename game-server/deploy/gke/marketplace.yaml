apiVersion: apps/v1
kind: Deployment
metadata: { name: marketplace }
spec:
  # The expiry poller is safe on every replica: settlement-{listingId} with
  # REJECT_DUPLICATE starts one run (ADR-0016). Migrate-on-boot serialises on a
  # postgres advisory lock. Known, deferred: each replica's outbox worker can
  # publish the same row (no SKIP LOCKED in common/outbox).
  replicas: 3
  selector: { matchLabels: { app: marketplace } }
  template:
    metadata: { labels: { app: marketplace } }
    spec:
      containers:
        - name: marketplace
          image: asia-east1-docker.pkg.dev/barrowspire-512613/barrowspire/marketplace:fe192a2
          ports:
            - { containerPort: 7127, name: grpc }
          envFrom:
            - configMapRef: { name: marketplace }
            - secretRef: { name: marketplace }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: 500m, memory: 256Mi }
          # No probes yet: marketplace does not register a gRPC health service.
---
apiVersion: v1
kind: Service
metadata: { name: marketplace }
spec:
  selector: { app: marketplace }
  ports: [{ port: 7127, targetPort: grpc }]
---
apiVersion: v1
kind: Service
metadata: { name: marketplace-headless }
spec:
  clusterIP: None
  selector: { app: marketplace }
  ports: [{ port: 7127, targetPort: grpc }]
