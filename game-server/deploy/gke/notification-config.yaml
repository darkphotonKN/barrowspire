apiVersion: v1
kind: ConfigMap
metadata: { name: notification }
data:
  SERVICE_VERSION: "1.0.0"
  ENVIRONMENT: "production"
  GRPC_NOTIFICATION_ADDR: "7190"
  DB_HOST: "10.6.0.3"
  DB_PORT: "5432"
  DB_NAME: "barrowspire_notification_service_db"
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"
  # the mailbox resolves a letter's item enclosures through items at send (FS-1GZGD R4)
  ITEMS_ADDR: "items-headless:7126"
  # a claimed letter's gold is credited through wallet (FS-1GZGD R16)
  WALLET_ADDR: "wallet-headless:7128"
  OTEL_ENABLED: "false"
  GOMEMLIMIT: "115MiB"
