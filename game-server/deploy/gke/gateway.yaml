apiVersion: apps/v1
kind: Deployment
metadata: { name: gateway }
spec:
  replicas: 1
  selector: { matchLabels: { app: gateway } }
  template:
    metadata: { labels: { app: gateway } }
    spec:
      containers:
        - name: gateway
          image: asia-east1-docker.pkg.dev/barrowspire-512613/barrowspire/gateway:dev
          ports: [{ containerPort: 7114, name: http }]
          envFrom:
            - configMapRef: { name: gateway }
            - secretRef: { name: gateway }
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: 500m, memory: 128Mi }
          readinessProbe:
            tcpSocket: { port: http } # placeholder; swap for httpGet on your health route later
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata: { name: gateway }
spec:
  selector: { app: gateway }
  ports: [{ port: 7114, targetPort: http }]
