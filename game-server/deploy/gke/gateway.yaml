apiVersion: apps/v1
kind: Deployment
metadata: { name: gateway }
spec:
  replicas: 2
  selector: { matchLabels: { app: gateway } }
  template:
    metadata: { labels: { app: gateway } }
    spec:
      containers:
        - name: gateway
          image: asia-east1-docker.pkg.dev/barrowspire-512613/barrowspire/gateway:4ca1793
          ports: [{ containerPort: 7114, name: http }]
          envFrom:
            - configMapRef: { name: gateway }
            - secretRef: { name: gateway }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  annotations:
    cloud.google.com/backend-config: '{"default": "gateway"}'
spec:
  selector: { app: gateway }
  ports: [{ port: 7114, targetPort: http }]
