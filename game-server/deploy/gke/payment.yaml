apiVersion: apps/v1
kind: Deployment
metadata: { name: payment }
spec:
  replicas: 0
  selector: { matchLabels: { app: payment } }
  template:
    metadata: { labels: { app: payment } }
    spec:
      containers:
        - name: payment
          image: asia-east1-docker.pkg.dev/barrowspire-512613/barrowspire/payment:e62a551
          # payment listens on gRPC only (Stripe webhooks arrive via the gateway as gRPC).
          ports:
            - { containerPort: 7134, name: grpc }
          envFrom:
            - configMapRef: { name: payment }
            - secretRef: { name: payment }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 128Mi }
          # No probes yet: payment does not register a gRPC health service.
---
apiVersion: v1
kind: Service
metadata: { name: payment }
spec:
  selector: { app: payment }
  ports: [{ port: 7134, targetPort: grpc }]
---
apiVersion: v1
kind: Service
metadata: { name: payment-headless }
spec:
  clusterIP: None
  selector: { app: payment }
  ports: [{ port: 7134, targetPort: grpc }]
