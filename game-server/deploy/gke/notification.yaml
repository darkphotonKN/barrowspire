apiVersion: apps/v1
kind: Deployment
metadata: { name: notification }
spec:
  # 1: notification migrates on boot, so several pods would race on the same migration
  replicas: 0
  selector: { matchLabels: { app: notification } }
  template:
    metadata: { labels: { app: notification } }
    spec:
      containers:
        - name: notification
          image: asia-east1-docker.pkg.dev/barrowspire-512613/barrowspire/notification:c52c7216
          ports:
            - { containerPort: 7190, name: grpc }
          envFrom:
            - configMapRef: { name: notification }
            # The notification Secret (created by hand, never committed) carries the
            # sensitive values, and must carry JWT_SECRET, the same key the gateway
            # signs with: notification verifies every forwarded mailbox token with it
            # and refuses to start without it (FS-1GZGD).
            - secretRef: { name: notification }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 128Mi }
          # No probes yet: notification does not register a gRPC health service.
---
apiVersion: v1
kind: Service
metadata: { name: notification }
spec:
  selector: { app: notification }
  ports: [{ port: 7190, targetPort: grpc }]
---
apiVersion: v1
kind: Service
metadata: { name: notification-headless }
spec:
  clusterIP: None
  selector: { app: notification }
  ports: [{ port: 7190, targetPort: grpc }]
