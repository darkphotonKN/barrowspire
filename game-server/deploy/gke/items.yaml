apiVersion: apps/v1
kind: Deployment
metadata: { name: items }
spec:
  # 1: items migrates on boot, so several pods would race on the same migration
  replicas: 3 
  selector: { matchLabels: { app: items } }
  template:
    metadata: { labels: { app: items } }
    spec:
      containers:
        - name: items
          image: asia-east1-docker.pkg.dev/barrowspire-512613/barrowspire/items:b66252f
          ports:
            - { containerPort: 7126, name: grpc }
            - { containerPort: 8197, name: metrics }
          envFrom:
            - configMapRef: { name: items }
            - secretRef: { name: items }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: 500m, memory: 256Mi }
          # No probes yet: items does not register a gRPC health service.
---
apiVersion: v1
kind: Service
metadata: { name: items }
spec:
  selector: { app: items }
  ports: [{ port: 7126, targetPort: grpc }]
---
apiVersion: v1
kind: Service
metadata: { name: items-headless }
spec:
  clusterIP: None
  selector: { app: items }
  ports: [{ port: 7126, targetPort: grpc }]