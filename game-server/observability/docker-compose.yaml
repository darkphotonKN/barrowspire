# Full Observability Stack
#
# This runs the complete observability infrastructure locally.
#
# Architecture:
#
#   Your Services ──→ OTel Collector (:4430) ──→ Tempo (traces)
#                           │
#                           ├─────────────────→ Prometheus (metrics)
#                           │
#                           └─────────────────→ Loki (logs)
#                                                    │
#                                                    ▼
#                                              Grafana (:3143)
#                                         (visualizes everything)
#
# Usage:
#   cd game-server/observability
#   docker compose up -d
#
# Access (barrowspire-offset ports — the upstream fireplace stack owns the
# defaults 3030/9090/3200/4317, so everything here is shifted):
#   Grafana:    http://localhost:3143
#   Prometheus: http://localhost:9203
#   Tempo:      http://localhost:3313 (API only, use Grafana to view)
#   Loki:       http://localhost:3213
#
# Your services connect to (COLLECTOR_ENDPOINT default):
#   OTel Collector: localhost:4430 (gRPC) or localhost:4431 (HTTP)

# Project + container names are barrowspire-prefixed so this stack can run
# alongside the fireplace/cosmic-void observability stacks. Ports are offset
# too; offsetting only the ports is not enough — Docker identity collides on
# the compose project name (derived from the directory) and container_name.
name: barrowspire-observability

services:
  # ============================================================================
  # OTEL COLLECTOR - Central telemetry router
  # ============================================================================
  # Receives traces/metrics/logs from your services
  # Routes them to appropriate backends
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: barrowspire-otel-collector
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./config/otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "4430:4317" # OTLP gRPC - your services send here
      - "4431:4318" # OTLP HTTP - alternative endpoint
      - "9002:8889" # Prometheus metrics endpoint (Prometheus scrapes this)
      - "13246:13133" # Health check
    depends_on:
      - tempo
      - loki
    networks:
      - observability

  # ============================================================================
  # TEMPO - Distributed tracing backend
  # ============================================================================
  # Stores and queries traces
  # Grafana connects here to display trace data
  tempo:
    image: grafana/tempo:2.3.1
    container_name: barrowspire-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./config/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/tmp/tempo
    ports:
      - "3313:3200" # HTTP
    networks:
      - observability

  # ============================================================================
  # PROMETHEUS - Metrics storage
  # ============================================================================
  # Scrapes metrics from OTel Collector
  # Grafana connects here for dashboards and alerts
  prometheus:
    image: prom/prometheus:latest
    container_name: barrowspire-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle" # Allows config reload via API
    volumes:
      - ./config/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9203:9090" # Prometheus UI and API
    networks:
      - observability

  # ============================================================================
  # LOKI - Log aggregation
  # ============================================================================
  # Receives logs from OTel Collector
  # Grafana connects here to search logs
  loki:
    # Pinned to 2.9.x: config/loki.yaml uses the v2 schema (boltdb-shipper,
    # schema v11, compactor.shared_store). Loki 3.x rejects all three and needs
    # a v13/tsdb migration. Pinned like tempo rather than tracking :latest.
    image: grafana/loki:2.9.4
    container_name: barrowspire-loki
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./config/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    ports:
      - "3213:3100" # Loki API
    networks:
      - observability

  # ============================================================================
  # GRAFANA - Visualization
  # ============================================================================
  # Single UI for traces (Tempo), metrics (Prometheus), and logs (Loki)
  # This is where you'll spend most of your debugging time
  grafana:
    image: grafana/grafana:latest
    container_name: barrowspire-grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    volumes:
      - ./config/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      # tells Grafana to look in /etc/grafana/dashboards for JSON files
      - ./config/grafana-dashboard-provisioning.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3143:3000" # Grafana UI - your main interface
    depends_on:
      - prometheus
      - tempo
      - loki
    networks:
      - observability

networks:
  observability:
    driver: bridge

volumes:
  tempo-data:
  prometheus-data:
  loki-data:
  grafana-data:
