syntax = "proto3";

package wallet;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/darkphotonKN/barrowspire-server/common/api/proto/wallet";

// Wallet service definition for member gold accounts.
service WalletService {
  // Create the gold account for a member.
  rpc CreateAccount(CreateAccountRequest) returns (CreateAccountResponse) {}
  // Get a member's account balance snapshot.
  rpc GetAccount(GetAccountRequest) returns (GetAccountResponse) {}
  // Reserve gold against a member's account for a bid.
  rpc PlaceHold(PlaceHoldRequest) returns (PlaceHoldResponse) {}
  // Give back a single reservation whose bid never landed.
  rpc ReleaseHold(ReleaseHoldRequest) returns (ReleaseHoldResponse) {}
  // List reservations old enough that their bid should have been written by now.
  rpc ListStaleReservedHolds(ListStaleReservedHoldsRequest) returns (ListStaleReservedHoldsResponse) {}
  // Add gold to a member's account.
  rpc Deposit(DepositRequest) returns (DepositResponse) {}
  // Remove gold from a member's account, up to what is not already held.
  rpc Withdraw(WithdrawRequest) returns (WithdrawResponse) {}
}

// CreateAccount
// Empty by design, same rule as GetAccountRequest: the member identity is
// derived from the authenticated context server-side, never supplied by the
// caller.
message CreateAccountRequest {}

// Newly birthed accounts hold no gold and carry no holds, so only the
// identity + birth facts are echoed back.
message CreateAccountResponse {
  string id        = 1;
  string member_id = 2;
  int64  gold      = 3;  // always 0 on creation, echoed for client convenience
  google.protobuf.Timestamp created_at = 4;
}

// GetAccount
// Empty by design: the member identity is derived from the authenticated
// context server-side, never supplied by the caller.
message GetAccountRequest {}

message GetAccountResponse {
  string id             = 1;
  string member_id      = 2;
  int64  gold           = 3;  // total ledger balance
  int64  held_gold      = 4;  // sum of RESERVED holds
  int64  available_gold = 5;  // gold - held_gold, spendable now
  google.protobuf.Timestamp created_at = 6;
}

// PlaceHold
// The account is resolved from the authenticated member in context server-side,
// so the caller only supplies what it owns: the amount and the bid it is for.
message PlaceHoldRequest {
  int64  gold   = 1;  // amount to reserve
  string bid_id = 2;  // bid the hold is placed against
  // When the hold lapses: the listing's expiry plus settlement grace, chosen by
  // the caller (FS-NXP1W Req 19). Required — wallet never derives it.
  google.protobuf.Timestamp expires_at = 3;
}

// Empty by design: the hold either succeeds or the call fails with a status
// code. The caller addresses the hold by the bid_id it already owns.
message PlaceHoldResponse {}

// ReleaseHold
// The compensating half of PlaceHold: the caller reserved gold for a bid and then
// could not record that bid, so the reservation has to go back.
//
// Addressed by bid_id alone, the same key PlaceHold was given. wallet cannot judge
// whether the bid exists — it has no listing or bid concept — so this is a command
// from the service that minted the id, never a decision wallet reaches on its own.
//
// Idempotent: releasing a hold that is already RELEASED succeeds, and a bid that
// never had a hold is nothing to give back rather than an error.
message ReleaseHoldRequest {
  string bid_id = 1;  // bid whose reservation is being given back
}

// Empty by design, same rule as PlaceHoldResponse.
message ReleaseHoldResponse {}

// ListStaleReservedHolds
// Reservations still RESERVED after the point their bid should have been written.
// The caller compares them against its own records and releases the ones that were
// never claimed; wallet only reports, it does not judge.
//
// reserved_before is what closes the race with a bid still in flight: a hold placed
// moments ago belongs to a request that may still be mid-write, and releasing it
// would leave a recorded bid with no gold behind it.
message ListStaleReservedHoldsRequest {
  google.protobuf.Timestamp reserved_before = 1;
  int32 limit = 2;  // batch ceiling, so one sweep cannot pull the whole table
}

message ListStaleReservedHoldsResponse {
  repeated string bid_ids = 1;
}

// Deposit
// The account is resolved from the authenticated member in context, so the
// caller supplies only the amount.
message DepositRequest {
  int64 gold = 1;  // amount to add, must be positive
}

// Empty by design, same rule as PlaceHoldResponse. Callers that need the new
// balance read it back with GetAccount.
message DepositResponse {}

// Withdraw
// Withdrawal is bounded by available gold, not total gold — reserved holds are
// not spendable. Exceeding it fails with FailedPrecondition.
message WithdrawRequest {
  int64 gold = 1;  // amount to remove, must be positive
}

// Empty by design, same rule as DepositResponse.
message WithdrawResponse {}
