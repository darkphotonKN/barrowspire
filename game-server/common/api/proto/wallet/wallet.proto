syntax = "proto3";

package wallet;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/darkphotonKN/barrowspire-server/common/api/proto/wallet";

// Wallet service definition for member gold accounts.
service WalletService {
  // Create the gold account for a member.
  rpc CreateAccount(CreateAccountRequest) returns (CreateAccountResponse) {}
  // Get a member's account balance snapshot.
  rpc GetAccount(GetAccountRequest) returns (GetAccountResponse) {}
  // Reserve gold against a member's account for a bid.
  rpc PlaceHold(PlaceHoldRequest) returns (PlaceHoldResponse) {}
}

// CreateAccount
// Empty by design, same rule as GetAccountRequest: the member identity is
// derived from the authenticated context server-side, never supplied by the
// caller.
message CreateAccountRequest {}

// Newly birthed accounts hold no gold and carry no holds, so only the
// identity + birth facts are echoed back.
message CreateAccountResponse {
  string id        = 1;
  string member_id = 2;
  int64  gold      = 3;  // always 0 on creation, echoed for client convenience
  google.protobuf.Timestamp created_at = 4;
}

// GetAccount
// Empty by design: the member identity is derived from the authenticated
// context server-side, never supplied by the caller.
message GetAccountRequest {}

message GetAccountResponse {
  string id             = 1;
  string member_id      = 2;
  int64  gold           = 3;  // total ledger balance
  int64  held_gold      = 4;  // sum of RESERVED holds
  int64  available_gold = 5;  // gold - held_gold, spendable now
  google.protobuf.Timestamp created_at = 6;
}

// PlaceHold
// The account is resolved from the authenticated member in context server-side,
// so the caller only supplies what it owns: the amount and the bid it is for.
message PlaceHoldRequest {
  int64  gold   = 1;  // amount to reserve
  string bid_id = 2;  // bid the hold is placed against
}

// Empty by design: the hold either succeeds or the call fails with a status
// code, nothing about it is useful to the caller yet.
message PlaceHoldResponse {}
