syntax = "proto3";

package marketplace;

import "google/protobuf/timestamp.proto";
import "api/proto/shared/v1/pagination.proto";

option go_package = "github.com/darkphotonKN/barrowspire-server/common/api/proto/marketplace";

// Marketplace service definition for listings and bids.
service MarketplaceService {
  // List one of the caller's items for sale at the given start price and end time.
  rpc ListItem(ListItemRequest) returns (ListItemResponse) {}
  // The caller's own listings, newest first, paged by cursor.
  rpc ListMyListings(ListMyListingsRequest) returns (ListMyListingsResponse) {}

  // Place a bid on an active listing, taking the lead from the current winner.
  rpc PlaceBid(PlaceBidRequest) returns (PlaceBidResponse) {}

  // Cancel a bid the caller placed.
  rpc WithdrawBid(WithdrawBidRequest) returns (WithdrawBidResponse) {}
}

// A listing as its seller sees it. The optimistic-locking version is internal
// and deliberately absent.
message Listing {
  string id = 1;
  string seller_id = 2;
  optional string buyer_id = 3;   // present once sold
  string item_id = 4;
  int64 start_price = 5;
  optional int64 sold_price = 6;  // present once sold
  string status = 7;
  google.protobuf.Timestamp ends_at = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}
// ListItem
// Empty by design: the member identity is derived from the authenticated
// context server-side, never supplied by the caller.
message ListItemRequest {
  string item_id = 1;
  int64 start_price = 2;
  google.protobuf.Timestamp ends_at = 3; 
}

message ListItemResponse {
  string id             = 1;
  string item_id = 2;
  int64 start_price = 3;
  string seller_id = 4;
  string status = 5;
  google.protobuf.Timestamp ends_at = 8;
  google.protobuf.Timestamp create_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}


// ListMyListings
// The seller is derived from the authenticated context server-side, never
// supplied by the caller, so there is no field for choosing another member.
message ListMyListingsRequest {
  string cursor = 1;  // opaque; empty for the first page
  int32  limit  = 2;
}

message ListMyListingsResponse {
  repeated Listing listings = 1;
  shared.v1.PageInfo pagination = 2;  // absent on the last page
}

// PlaceBid
// The bidder is derived from the authenticated context server-side, never
// supplied by the caller — same rule as ListMyListingsRequest.
message PlaceBidRequest {
  string listing_id = 1;
  int64  amount     = 2;
  // Idempotency key for safe retries. Optional; when empty the bid is never
  // deduplicated, so a retried request becomes a second bid.
  string idempotency_key = 3;
}

message PlaceBidResponse {
  string bid_id        = 1;
  string status        = 2;  // WINNING on success
  int64  current_price = 3;  // what the listing now stands at
}

// WithdrawBid
// Cancels a bid the caller placed. Ownership is enforced server-side; a bid
// belonging to another member is rejected rather than silently ignored.
message WithdrawBidRequest {
  string listing_id = 1;
  string bid_id     = 2;
}

message WithdrawBidResponse {
  string bid_id        = 1;
  string status        = 2;  // CANCELLED on success
  int64  current_price = 3;  // falls back to the reserve if the leader withdrew
}
