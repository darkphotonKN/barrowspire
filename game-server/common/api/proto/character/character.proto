syntax = "proto3";
package character;
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
option go_package = "github.com/darkphotonKN/barrowspire-server/common/api/proto/character";

// CharacterService owns characters per member (FS-BDA7X R1–R4). Every call
// carries the member it acts for; another member's, a deleted, and an unknown
// character are all NotFound.
service CharacterService {
  rpc CreateCharacter(CreateCharacterRequest) returns (Character);
  rpc ListCharacters(ListCharactersRequest) returns (ListCharactersResponse);
  rpc GetCharacter(GetCharacterRequest) returns (Character);
  rpc DeleteCharacter(DeleteCharacterRequest) returns (google.protobuf.Empty);
  // SpendPassivePoint takes one rank of a passive tree node (FS-8RZ51 R12–R13).
  // The rule is decided again under the character's row lock. A target rank
  // already held is OK with applied = false and writes nothing (R10). A rule's
  // refusal is FailedPrecondition with an ErrorInfo carrying its PASSIVE_* code.
  rpc SpendPassivePoint(SpendPassivePointRequest) returns (SpendPassivePointResponse);
}

message Character {
  string id = 1;
  string name = 2;
  // warrior, mage or archer
  string class = 3;
  int32 level = 4;
  // total experience, monotonic
  int64 experience = 5;
  // total experience at which level began
  int64 level_floor = 6;
  // total experience for the next level; unset at the cap
  optional int64 next_level_at = 7;
  google.protobuf.Timestamp created_at = 8;
  // held passive tree ranks, nodes at rank 1 or more, by node id (FS-8RZ51 R14)
  repeated PassiveRank passive_ranks = 9;
  // the specialization the held tier-6 node grants: guardian, berserker,
  // spellwarden, pyromancer, hunter, shadow_ranger, duelist or sellsword;
  // unset before the pick (FS-E1ZDG R4-R5)
  optional string specialization = 10;
}

// PassiveRank is one held node of the passive tree.
message PassiveRank {
  // <class>.<slot>, e.g. warrior.t1a
  string node_id = 1;
  int32 rank = 2;
}

message CreateCharacterRequest {
  string member_id = 1;
  string name = 2;
  string class = 3;
}

message ListCharactersRequest {
  string member_id = 1;
}

// Live characters only, oldest first.
message ListCharactersResponse {
  repeated Character characters = 1;
}

message GetCharacterRequest {
  string member_id = 1;
  string character_id = 2;
}

message DeleteCharacterRequest {
  string member_id = 1;
  string character_id = 2;
}

message SpendPassivePointRequest {
  string member_id = 1;
  string character_id = 2;
  string node_id = 3;
  // the target rank: the rank held plus one; the idempotency key (ADR-0083)
  int32 rank = 4;
}

message SpendPassivePointResponse {
  // false when the target rank was already held and nothing was written
  bool applied = 1;
  // every rank the character holds after the spend
  repeated PassiveRank passive_ranks = 2;
}
