syntax = "proto3";
package items;
import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";
import "api/proto/events/game.proto";
option go_package = "github.com/darkphotonKN/barrowspire-server/common/api/proto/items";

// ItemsService external API for items
service ItemsService {
  // general
  rpc ListItemTemplates(google.protobuf.Empty) returns (ListItemTemplatesResponse);

  // ItemType operations (for dropdown/select options)
  rpc ListItemTypes(google.protobuf.Empty) returns (ListItemTypesResponse);

  // ItemRarity operations (for dropdown/select options)
  rpc ListItemRarities(google.protobuf.Empty) returns (ListItemRaritiesResponse);

  // Weapon operations
  rpc CreateWeapon(CreateWeaponRequest) returns (Weapon);
  rpc GetWeaponWithTemplateByID(GetWeaponRequest) returns (WeaponDetail);
  rpc ListWeaponsWithTemplate(google.protobuf.Empty) returns (ListWeaponsResponse);

  // Armor operations
  rpc ListArmorsWithTemplate(google.protobuf.Empty) returns (ListArmorsResponse);

  // Consumable operations
  rpc ListConsumablesWithTemplate(google.protobuf.Empty) returns (ListConsumablesResponse);

  // ItemTemplate operations
  rpc CreateItemTemplate(CreateItemTemplateRequest) returns (ItemTemplate);

  // Complete item operations (creates both specific item + template)
  rpc CreateCompleteWeapon(CreateCompleteWeaponRequest) returns (WeaponDetail);
  rpc CreateCompleteArmor(CreateCompleteArmorRequest) returns (ArmorDetail);
  rpc CreateCompleteConsumable(CreateCompleteConsumableRequest) returns (ConsumableDetail);

  rpc GetLoadout(GetLoadoutRequest) returns (GetLoadoutResponse);
  rpc GetLoadoutWithItems(GetLoadoutWithItemsRequest) returns (GetLoadoutWithItemsResponse);
  // Checks the member's worn and bag items out into a run or field world at
  // seating: AVAILABLE ones move to IN_RUN under run_id, and items still IN_RUN
  // under another run id are re-tagged to it (FS-18Z5F R5-R11, ADR-0032).
  // Returns what is now IN_RUN under run_id, worn in slots and the bag as a list.
  rpc CheckOutRunGear(CheckOutRunGearRequest) returns (CheckOutRunGearResponse);
  // Applies one run settlement now, through the same path the items.extracted
  // consumer takes, so the call and the event's async copy apply it once
  // between them; a repeat is success (FS-GV8WN R11, ADR-0040). Called by
  // game-service, not a player: no token.
  rpc ApplySettlement(ApplySettlementRequest) returns (ApplySettlementResponse);
  rpc ListItemInstances(ListItemInstancesRequest) returns (ListItemInstancesResponse);
  rpc UpdateLoadout(UpdateLoadoutRequest) returns (UpdateLoadoutResponse);
  // Moves one of the caller's unworn, AVAILABLE instances between bag and
  // stash (FS-VPD8Y R10). Domain refusals answer FailedPrecondition with an
  // ErrorInfo reason (R13).
  rpc MoveItemInstance(MoveItemInstanceRequest) returns (MoveItemInstanceResponse);

  // marketplace service - item service - listing
  rpc ReserveItem(ReserveItemRequest) returns (ReserveItemResponse);
  rpc ListStaleReserved(ListStaleReservedRequest) returns (ListStaleReservedResponse);
  rpc CancelReservation(CancelReservationRequest) returns (CancelReservationResponse);
  // Marks a reservation as matched by its listing, so the reconciler stops asking
  // about it and can no longer cancel it. Idempotent: confirming an already
  // confirmed reservation for the same listing answers confirmed again.
  rpc ConfirmReservation(ConfirmReservationRequest) returns (ConfirmReservationResponse);
  // Gives back an item whose reservation was confirmed but whose listing will
  // never exist (FS-04ZB6 Req 4). Never touches a waiting reservation.
  rpc ReleaseConfirmedReservation(ReleaseConfirmedReservationRequest) returns (ReleaseConfirmedReservationResponse);
  // Pages the confirmed reservations older than an age, for the backstop that
  // releases one whose listing never got created (FS-04ZB6 Req 5).
  rpc ListConfirmedReservations(ListConfirmedReservationsRequest) returns (ListConfirmedReservationsResponse);

  // Public display facts for item instances, by id. Unknown ids are omitted.
  rpc GetItemSummaries(GetItemSummariesRequest) returns (GetItemSummariesResponse);

  // Resolves templates and existing instances into item snapshots, the full
  // description of an item a grant can mint later (FS-1GZGD R21, A1, A2). No
  // drop rule is applied, only representability. Called by notification-service
  // when a letter is sent, often with no member behind it: no token.
  rpc ResolveItemSnapshots(ResolveItemSnapshotsRequest) returns (ResolveItemSnapshotsResponse);
  // Mints item snapshots into the stash of the member in the forwarded token, in
  // one transaction, all or nothing (STASH_FULL). grant_id is unique: a repeat
  // mints nothing and answers the first grant's ids, already_granted set
  // (FS-1GZGD R18-R20, ADR-0044).
  rpc GrantItems(GrantItemsRequest) returns (GrantItemsResponse);
}

// ============ Layered Message Definitions ============

// Layer 1: Basic Weapon (weapons table only - for create/simple queries)
message Weapon {
  string id = 1;
  reserved 2, 5;
  reserved "type_id", "durability";
  string rarity_id = 3;
  int32 attack_power = 4;
  float critical_rate = 6;
  string weapon_type = 7;
  string description = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

// Layer 2: WeaponDetail (weapons + item_templates joined - for detailed queries)
message WeaponDetail {
  // Weapon specific fields (from weapons table)
  string id = 1;
  reserved 2, 5;
  reserved "type_id", "durability";
  string rarity_id = 3;
  int32 attack_power = 4;
  float critical_rate = 6;
  string weapon_type = 7;
  string description = 8;

  // ItemTemplate fields (from item_templates table)
  string item_template_id = 9;
  string item_name = 10;
  string item_code = 11;
  string icon_url = 12;
  reserved 13, 14;
  reserved "is_tradeable", "is_droppable";
  int32 required_level = 15;
  int32 base_sell_price = 16;
  int32 base_buy_price = 17;

  google.protobuf.Timestamp created_at = 18;
  google.protobuf.Timestamp updated_at = 19;
}

// ============ Request/Response Messages ============

// ItemType (from item_types table - for dropdown options)
message ItemType {
  string id = 1;
  string name = 2;
  string description = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message ListItemTypesResponse {
  repeated ItemType item_types = 1;
}

// ItemRarity (from item_rarities table - for dropdown options)
message ItemRarity {
  string id = 1;
  string name = 2;
  string description = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
  string rarity_code = 6;
  double drop_rate_multiplier = 7;
}

message ListItemRaritiesResponse {
  repeated ItemRarity item_rarities = 1;
}

message CreateWeaponRequest {
  reserved 1, 4;
  reserved "type_id", "durability";
  string rarity_id = 2;
  int32 attack_power = 3;
  float critical_rate = 5;
  string weapon_type = 6;
  string description = 7;
}

message GetWeaponRequest {
  string id = 1;
}

message ListWeaponsResponse {
  repeated WeaponDetail weapons = 1;
}

// ArmorDetail (armors + item_templates joined)
message ArmorDetail {
  // Armor fields
  string id = 1;
  reserved 2, 5;
  reserved "type_id", "durability";
  string rarity_id = 3;
  int32 defense_rating = 4;
  int32 magic_resistance = 6;
  string armor_slot = 7;
  string description = 8;

  // ItemTemplate fields
  string item_template_id = 9;
  string item_name = 10;
  string item_code = 11;
  string icon_url = 12;
  reserved 13, 14;
  reserved "is_tradeable", "is_droppable";
  int32 required_level = 15;
  int32 base_sell_price = 16;
  int32 base_buy_price = 17;

  google.protobuf.Timestamp created_at = 18;
  google.protobuf.Timestamp updated_at = 19;
}

message ListItemTemplatesResponse {
  repeated ItemTemplate items = 1;
}

message ListArmorsResponse {
  repeated ArmorDetail armors = 1;
}

// ConsumableDetail (consumables + item_templates joined)
message ConsumableDetail {
  // Consumable fields
  string id = 1;
  reserved 2;
  reserved "type_id";
  string rarity_id = 3;
  int32 healing_amount = 4;
  int32 mana_amount = 5;
  int32 buff_duration = 6;
  int32 max_stack_size = 7;
  string description = 8;

  // ItemTemplate fields
  string item_template_id = 9;
  string item_name = 10;
  string item_code = 11;
  string icon_url = 12;
  reserved 13, 14;
  reserved "is_tradeable", "is_droppable";
  int32 required_level = 15;
  int32 base_sell_price = 16;
  int32 base_buy_price = 17;

  google.protobuf.Timestamp created_at = 18;
  google.protobuf.Timestamp updated_at = 19;
}

message ListConsumablesResponse {
  repeated ConsumableDetail consumables = 1;
}

// ItemTemplate (unified aggregate: item_templates joined with weapons/armors/consumables/rarities)
message ItemTemplate {
  // base template
  string id = 1;
  string item_name = 2;
  string rarity = 3;
  string item_type = 4;
  string icon_url = 5;
  int32 required_level = 6;
  int32 base_sell_price = 7;
  int32 base_buy_price = 8;

  // weapon
  int32 attack_power = 9;
  float critical_rate = 10;
  string weapon_type = 11;

  // armor
  int32 defense_rating = 12;
  int32 magic_resistance = 13;
  string armor_slot = 14;

  // consumable
  int32 healing_amount = 15;
  int32 mana_amount = 16;
  int32 buff_duration = 17;
  int32 max_stack_size = 18;

  // coalesced
  string description = 19;

  // timestamps
  google.protobuf.Timestamp created_at = 20;
  google.protobuf.Timestamp updated_at = 21;

  // Lowest item level this template can drop at; 1 for tier I (FS-4R9M9 R1).
  int32 min_item_level = 22;
  // Present only for a Fabled unique: its unique row (FS-4R9M9 R6, R8).
  optional UniqueItem unique = 23;
}

// A unique's row (FS-4R9M9 R6): its effect code (closed set, R31), the
// one-line effect text shown to players and its fixed affixes as stat ranges.
message UniqueItem {
  string effect_code = 1;
  string effect_text = 2;
  repeated AffixRange fixed_affixes = 3;
}

// A fixed affix of a unique: a stat code and the inclusive range it rolls in
// (FS-4R9M9 R19, R27).
message AffixRange {
  string stat = 1;
  int32 min = 2;
  int32 max = 3;
}

// CreateItemTemplateRequest for creating item templates
message CreateItemTemplateRequest {
  string user_id = 1;
  string item_name = 2;
  string rarity_id = 3;
  string item_type = 4;       // 'weapon', 'armor', 'consumable'
  string item_id = 5;         // references weapon/armor/consumable id
  optional string icon_url = 6;
  optional int32 required_level = 7;
  optional int32 base_sell_price = 8;
  optional int32 base_buy_price = 9;
}

// CreateCompleteWeaponRequest creates weapon + template in one transaction
message CreateCompleteWeaponRequest {
  string user_id = 1;
  string item_name = 2;
  optional string icon_url = 3;
  optional int32 required_level = 4;
  optional int32 base_sell_price = 5;
  optional int32 base_buy_price = 6;
  string rarity_id = 7;
  int32 attack_power = 8;
  float critical_rate = 9;
  string weapon_type = 10;
  string description = 11;
}

// CreateCompleteArmorRequest creates armor + template in one transaction
message CreateCompleteArmorRequest {
  string user_id = 1;
  string item_name = 2;
  optional string icon_url = 3;
  optional int32 required_level = 4;
  optional int32 base_sell_price = 5;
  optional int32 base_buy_price = 6;
  string rarity_id = 7;
  int32 defense_rating = 8;
  int32 magic_resistance = 9;
  string armor_slot = 10;
  string description = 11;
}

// CreateCompleteConsumableRequest creates consumable + template in one transaction
message CreateCompleteConsumableRequest {
  string user_id = 1;
  string item_name = 2;
  optional string icon_url = 3;
  optional int32 required_level = 4;
  optional int32 base_sell_price = 5;
  optional int32 base_buy_price = 6;
  string rarity_id = 7;
  int32 healing_amount = 8;
  int32 mana_amount = 9;
  int32 buff_duration = 10;
  int32 max_stack_size = 11;
  string description = 12;
}

message GetLoadoutRequest {
  string member_id= 1;
  // Whose loadout: the character it is read for (FS-50MTX R22).
  string character_id = 2;
}

message GetLoadoutResponse {
  string id = 1;
  string memberId = 2;
  string weaponId = 3;
  string headId = 4;
  string chestId = 5;
  string glovesId = 6;
  string legsId = 7;
  string ring1Id = 8;
  string ring2Id = 9;
  string consumable1Id = 10;
  string consumable2Id = 11;
  string consumable3Id = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;
}

message ListItemInstancesRequest {
  string member_id = 1;
  // Optional. Set: that character's held instances plus the account's stash.
  // Empty: the stash only (FS-50MTX R23).
  string character_id = 2;
}

message ItemInstance {
  string id = 1;
  string template_id = 2;
  string owner_member_id = 3;
  string source = 4;
  string item_type = 5;
  string name = 6;
  string rarity_id = 7;
  int32 attack_power = 8;
  float critical_rate = 9;
  string weapon_type = 10;
  int32 defense_rating = 11;
  int32 magic_resistance = 12;
  string armor_slot = 13;
  int32 healing_amount = 14;
  int32 mana_amount = 15;
  int32 buff_duration = 16;
  int32 buy_price = 17;
  int32 sell_price = 18;
  string description = 19;
  // Lifecycle status: AVAILABLE, LISTED, PENDING_SETTLEMENT (FS-8EGFA,
  // FS-NXP1W) or IN_RUN (FS-18Z5F).
  string status = 20;
  // Minimum character level to equip (FS-BDA7X Req 30): derived requirement;
  // the template's for legacy rows (FS-4R9M9 R23-24, R48).
  int32 required_level = 21;
  // Item level the item dropped at; 1 for legacy rows (FS-4R9M9 R48).
  int32 item_level = 22;
  // Rolled affixes, in roll order; empty for legacy rows (FS-4R9M9 R16, R48).
  repeated Affix affixes = 23;
  // For a unique, its effect code and effect text; empty otherwise (FS-4R9M9 R51).
  string unique_effect_code = 24;
  string unique_effect_text = 25;
  // Where the owner keeps it: "bag" or "stash", lowercase, the HTTP vocabulary
  // (FS-VPD8Y R14). Worn is the loadout, not a location value.
  string location = 26;
  // The holder, the character holding it; empty for a stash item (FS-50MTX R24).
  string character_id = 27;
}

// One rolled affix (FS-4R9M9 R16): a stat code from the affix table, the tier
// it rolled at (1-3; 0 = a unique's fixed affix, R19) and its integer value.
message Affix {
  string stat = 1;
  int32 tier = 2;
  int32 value = 3;
}

message ListItemInstancesResponse {
  repeated ItemInstance items = 1;
}

message GetLoadoutWithItemsRequest {
  string member_id = 1;
  // Whose loadout: the character in play (FS-50MTX R28).
  string character_id = 2;
}

message GetLoadoutWithItemsResponse {
  ItemInstance weapon = 1;
  ItemInstance head = 2;
  ItemInstance chest = 3;
  ItemInstance gloves = 4;
  ItemInstance legs = 5;
  ItemInstance ring_1 = 6;
  ItemInstance ring_2 = 7;
  ItemInstance consumable_1 = 8;
  ItemInstance consumable_2 = 9;
  ItemInstance consumable_3 = 10;
}

// The caller must be member_id (FS-18Z5F R6). run_id is the world's own id:
// a run's session id, or a field visit's id (R3).
message CheckOutRunGearRequest {
  string member_id = 1;
  string run_id = 2;
  // Whose gear: the set is this character's worn and bag instances (FS-50MTX R25).
  string character_id = 3;
}

// Every instance here has status IN_RUN. A worn item that stayed home (listed,
// pending settlement) is an empty slot (R8). The bag is not capped (R11).
message CheckOutRunGearResponse {
  GetLoadoutWithItemsResponse loadout = 1;
  repeated ItemInstance bag = 2;
}

// event_id is the settlement's outbox row id, the MessageId its
// items.extracted copy carries, so both dedup on one inbox key.
message ApplySettlementRequest {
  string event_id = 1;
  events.ItemsExtractedEvent event = 2;
}

message ApplySettlementResponse {}

message UpdateLoadoutRequest {
  string member_id = 1;
  string slot = 2;
  string item_instance_id = 3;
  // Whose slot: the character the loadout write is for (FS-50MTX R10).
  string character_id = 4;
}

message UpdateLoadoutResponse {
  bool success = 1;
}

// The caller comes from the authenticated context only, never a field here
// (FS-VPD8Y R12).
message MoveItemInstanceRequest {
  string item_instance_id = 1;
  // "bag" or "stash", lowercase, the HTTP vocabulary.
  string location = 2;
  // The character moving it, in both directions (FS-50MTX R18).
  string character_id = 3;
}

// The instance's location after the call; unchanged on a no-op.
message MoveItemInstanceResponse {
  string id = 1;
  // "bag" or "stash", lowercase.
  string location = 2;
}


message ReserveItemRequest {
  string item_id = 1;
  int64 start_price = 2; 
  google.protobuf.Timestamp ends_at = 3; 
  // marketplace's term, forwarded onto ItemReservedEvent unread (FS-9XKS6)
  optional int64 buyout_price = 4;
}

message ReserveItemResponse {
  string id          = 1;
  string template_id = 2;
  string owner_member_id = 3;
  string source     = 4;
  string item_type = 5;              // 'weapon' | 'armor' | 'consumable'
  string name = 6;
  optional string rarity_id = 7;     // UUID as string

  // Weapon stats (null if not weapon)
  optional int32 attack_power = 8;
  optional double critical_rate = 9;
  optional string weapon_type = 10;

  // Armor stats (null if not armor)
  optional int32 defense_rating = 11;
  optional int32 magic_resistance = 12;
  optional string armor_slot = 13;   // 'head' | 'chest' | 'legs' | 'gloves'

  // Consumable stats (null if not consumable)
  optional int32 healing_amount = 14;
  optional int32 mana_amount = 15;
  optional int32 buff_duration = 16;

  optional int32 durability = 17;
  optional string description = 18;
  string status = 19;
}

message ListStaleReservedRequest {
  // was a cutoff timestamp the caller computed on its own clock
  reserved 1;
  reserved "reservedBefore";
  // How long a reservation must have waited for its listing. items-service
  // measures it on its own database clock, the same clock that stamped the
  // reservation. Must be positive.
  google.protobuf.Duration older_than = 2;
  // Opaque position to read after: the previous page's next. Empty for the first
  // page.
  string after = 3;
  // At most 100; a missing or larger limit is 100.
  int32 limit = 4;
}
message StaleReservation {
  string item_id = 1;
  string listing_id = 2;
}
message ListStaleReservedResponse {
  // was the item ids alone; the listing id now fences the follow-up write
  reserved 1;
  reserved "item_ids";
  // Oldest reservation first.
  repeated StaleReservation reservations = 2;
  // Position of the following page; empty on the last page.
  string next = 3;
}
// Both ids are required: the write acts only on the reservation for that listing.
message CancelReservationRequest {
  string item_id = 1;
  string listing_id = 2;
}
message CancelReservationResponse {}
message ConfirmReservationRequest {
  string item_id = 1;
  string listing_id = 2;
}
message ConfirmReservationResponse {
  // true when the item is LISTED for this listing, now confirmed (a repeat
  // included); false when it is not: cancelled, relisted or past LISTED.
  bool confirmed = 1;
}
// Both ids are required: the write acts only on the confirmed reservation for
// that listing.
message ReleaseConfirmedReservationRequest {
  string item_id = 1;
  string listing_id = 2;
}
message ReleaseConfirmedReservationResponse {
  // true when the item was LISTED and confirmed for this listing and is now
  // AVAILABLE with no listing; false when nothing matched and nothing changed.
  bool released = 1;
}
message ListConfirmedReservationsRequest {
  // How long ago a reservation must have been confirmed. items-service measures
  // it on its own database clock, the clock that stamped the confirmation. Must
  // be positive.
  google.protobuf.Duration older_than = 1;
  // Opaque position to read after: the previous page's next. Empty for the first
  // page.
  string after = 2;
  // At most 100; a missing or larger limit is 100.
  int32 limit = 3;
}
message ConfirmedReservation {
  string item_id = 1;
  string listing_id = 2;
}
message ListConfirmedReservationsResponse {
  // Oldest confirmation first.
  repeated ConfirmedReservation reservations = 1;
  // Position of the following page; empty on the last page.
  string next = 2;
}

// GetItemSummaries
// What anyone may see of an item instance: no owner, no source, no price.
message GetItemSummariesRequest {
  repeated string ids = 1;  // at most 100
}

message ItemSummary {
  string id = 1;                  // the instance id
  string name = 2;
  optional string description = 3;
  string item_type = 4;           // 'weapon' | 'armor' | 'consumable'
  string rarity = 5;              // the rarity code: normal, uncommon, rare, runed, fabled
  optional string weapon_type = 6;
  optional string armor_slot = 7;

  // stats, present when the item type has them
  optional int32 attack_power = 8;
  optional double critical_rate = 9;
  optional int32 defense_rating = 10;
  optional int32 magic_resistance = 11;
  optional int32 healing_amount = 12;
  optional int32 mana_amount = 13;
  optional int32 buff_duration = 14;

  // FS-4R9M9 R52: item level, derived required level and rolled affixes.
  int32 item_level = 15;
  int32 required_level = 16;
  repeated Affix affixes = 17;
  // For a unique, its effect text; absent otherwise. Never the effect code (FS-4R9M9 R52).
  optional string unique_effect_text = 18;
}

message GetItemSummariesResponse {
  repeated ItemSummary summaries = 1;
}

// ============ Item snapshots and grants (FS-1GZGD) ============

// ItemSnapshot is everything a grant mints from and an item view shows, in the
// facts of ItemSummary, without an instance id: there is no instance until a
// grant mints one (FS-1GZGD R21, A2).
message ItemSnapshot {
  string template_id = 1;
  string name = 2;
  optional string description = 3;
  string item_type = 4;           // 'weapon' | 'armor' | 'consumable' | 'ring'
  optional string weapon_type = 5;
  optional string armor_slot = 6;
  // The rarity code: normal, uncommon, rare, runed, fabled; empty for a copy
  // of a legacy instance that carries no rarity.
  string rarity = 7;

  // stats, present when the item type has them
  optional int32 attack_power = 8;
  optional double critical_rate = 9;
  optional int32 defense_rating = 10;
  optional int32 magic_resistance = 11;
  optional int32 healing_amount = 12;
  optional int32 mana_amount = 13;
  optional int32 buff_duration = 14;
  // The template's durability; templates carry none today, so it is absent.
  optional int32 durability = 15;

  int32 item_level = 16;          // >= 1
  int32 required_level = 17;      // >= 1
  repeated Affix affixes = 18;
  // For a unique's template, its effect text; absent otherwise.
  optional string unique_effect_text = 19;
}

// A template to resolve: a fresh item of it, at item_level when given, else
// at the template's min_item_level. A given item_level below 1 is
// unrepresentable.
message TemplateSnapshotRequest {
  string template_id = 1;
  optional int32 item_level = 2;
}

// At most 100 templates and 100 instance ids. The same id may appear more
// than once (a template at two item levels).
message ResolveItemSnapshotsRequest {
  repeated TemplateSnapshotRequest templates = 1;
  repeated string instance_ids = 2;
}

// One requested id and, when it resolved, its snapshot.
message ResolvedItemSnapshot {
  string id = 1;
  // Absent when the id is unknown or unrepresentable.
  optional ItemSnapshot snapshot = 2;
}

message ResolveItemSnapshotsResponse {
  // Index-aligned with the request: templates[i] answers request.templates[i],
  // instances[i] answers request.instance_ids[i].
  repeated ResolvedItemSnapshot templates = 1;
  repeated ResolvedItemSnapshot instances = 2;
  // The ids that did not resolve, each once, so the caller can refuse with
  // UNKNOWN_ITEM_TEMPLATE, UNKNOWN_ITEM_INSTANCE or ENCLOSURE_INVALID (A3).
  repeated string unknown_template_ids = 3;
  repeated string unknown_instance_ids = 4;
  // Known ids that cannot be minted: an item level below 1, or a copy source
  // with a malformed affix.
  repeated string unrepresentable_ids = 5;
}

message GrantItem {
  ItemSnapshot snapshot = 1;
  int32 quantity = 2;             // 1-60
}

// The member is the forwarded token's, never a field here (FS-1GZGD D18).
message GrantItemsRequest {
  // The caller's unique key for this grant (ADR-0009), 1-200 characters.
  string grant_id = 1;
  // 1-60 entries; their quantities together are the grant's slot count.
  repeated GrantItem items = 2;
}

message GrantItemsResponse {
  // The minted instances, quantity per entry, in request order; on a repeat,
  // the first grant's ids in the same order.
  repeated string item_ids = 1;
  // True when grant_id was already granted and this call minted nothing.
  bool already_granted = 2;
}
