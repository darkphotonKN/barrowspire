      bearerFormat: JWT
      description: "Access token from POST /api/member/signin, sent as `Authorization: Bearer <token>`."
      scheme: bearer
      type: http
info:
  description: HTTP surface of the barrowspire gateway. Errors are RFC 9457 problem+json carrying a stable `code`; clients switch on `code`, never on `detail`.
  title: barrowspire gateway
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/admin/mail:
    post:
      description: An admin sends an official letter to one member, to a list of members (one letter per distinct member, all stored or none) or to every member (one broadcast letter). Item enclosures are resolved into snapshots now; the letter shows and gives exactly those. Admins only (403 otherwise). The letter rules — lengths, enclosure bounds, expiry, the list's size — are notification-service's and come back as 400 with their code.
      operationId: send-official-letter
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendLetterBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SentLetters"
          description: Created
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Forbidden
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Service Unavailable
      security:
        - bearerAuth: []
      summary: Send an official letter
      tags:
        - mailbox
  /api/characters:
    get:
      description: Lists the signed-in member's live characters, oldest first, each with its level and experience. The member is taken from the token, never the request.
      operationId: list-my-characters
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CharacterList"
          description: OK
        "401":
