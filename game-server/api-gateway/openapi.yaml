      parameters:
        - description: opaque position, do not construct.
          explode: false
          in: query
          name: cursor
          schema:
            description: opaque position, do not construct.
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            default: 50
            format: int64
            maximum: 100
            minimum: 1
            type: integer
