components:
  schemas:
    AcceptBidBody:
      additionalProperties: false
      properties:
        minAmount:
          description: The leading bid amount the seller was shown. The accept is refused with LEADING_BID_LOWERED when the leading bid is now below it; at or above it, whichever bid leads is accepted.
          format: int64
          minimum: 1
          type: integer
      required:
        - minAmount
      type: object
    Affix:
      additionalProperties: false
      properties:
        stat:
          description: The stat the affix raises, by its stat code.
          type: string
        tier:
          description: Affix tier, 1 to 3; 0 is a unique's fixed affix.
          format: int32
          maximum: 3
          minimum: 0
          type: integer
        value:
          description: "Whole units: percent for attack and move speed, percentage points for crit."
          format: int32
          minimum: 0
          type: integer
      required:
        - stat
        - tier
        - value
      type: object
    ArmorDetail:
      additionalProperties: false
      properties:
        armor_slot:
          type: string
        base_buy_price:
          format: int32
          type: integer
        base_sell_price:
          format: int32
          type: integer
        created_at:
          $ref: "#/components/schemas/Timestamp"
        defense_rating:
          format: int32
          type: integer
        description:
          type: string
        icon_url:
          type: string
        id:
          type: string
        item_code:
          type: string
        item_name:
          type: string
        item_template_id:
          type: string
        magic_resistance:
          format: int32
          type: integer
        rarity_id:
          type: string
        required_level:
          format: int32
          type: integer
        updated_at:
          $ref: "#/components/schemas/Timestamp"
      type: object
    AvatarUploadEnvelope:
      additionalProperties: false
      properties:
        message:
          description: Human-readable summary
          type: string
        result:
          $ref: "#/components/schemas/AvatarUploadResult"
          description: Presigned upload details
        statusCode:
          description: Duplicates the HTTP status
          format: int64
          type: integer
      required:
        - statusCode
        - message
        - result
      type: object
    AvatarUploadResult:
      additionalProperties: false
      properties:
        allowed_content_types:
          description: Accepted content types
          items:
            type: string
          type:
            - array
            - "null"
        expires_at:
          $ref: "#/components/schemas/Timestamp"
          description: Presigned URL expiry
        max_file_size:
          description: Maximum accepted size in bytes
          format: int64
          type: integer
        presigned_url:
          description: S3 URL to PUT the file to
          type: string
        s3_key:
          description: Object key
          type: string
        upload_id:
          description: Correlates the request with its confirmation
          type: string
      type: object
    BuyoutBody:
      additionalProperties: false
      properties:
        amount:
          description: Gold the buyer agrees to pay. Must equal the listing's buyoutPrice; the buyer is always charged that price.
          format: int64
          minimum: 1
          type: integer
      required:
        - amount
      type: object
    ChangeEmailBody:
      additionalProperties: false
      properties:
        email:
          description: The new email address
          type: string
      required:
        - email
      type: object
    Character:
      additionalProperties: false
      properties:
        class:
          description: warrior, mage, archer or mercenary.
          type: string
        createdAt:
          description: Creation time.
          format: date-time
          type: string
        experience:
          description: Total experience, monotonic.
          format: int64
          minimum: 0
          type: integer
        id:
          description: Character id.
          format: uuid
          type: string
        level:
          description: Current level.
          format: int32
          maximum: 20
          minimum: 1
          type: integer
        levelFloor:
          description: Total experience at which the current level began.
          format: int64
          minimum: 0
          type: integer
        name:
          description: Character name.
          type: string
        nextLevelAt:
          description: Total experience for the next level; absent at the level cap.
          format: int64
          type: integer
      required:
        - id
        - name
        - class
        - level
        - experience
        - levelFloor
        - createdAt
      type: object
    CharacterCreate:
      additionalProperties: false
      properties:
        class:
          description: warrior, mage, archer or mercenary (decided by character-service).
          type: string
        name:
          description: Character name. Validity (1-32 characters after trimming, unique) is decided by character-service.
          type: string
      required:
        - name
        - class
      type: object
    CharacterList:
      additionalProperties: false
      properties:
        characters:
          description: Live characters, oldest first. Empty for a member with none.
          items:
            $ref: "#/components/schemas/Character"
          type: array
      required:
        - characters
      type: object
    ClaimedLetter:
      additionalProperties: false
      properties:
        claimState:
          description: "Always claimed: a claim that did not complete answers an error."
          enum:
            - claimed
          type: string
        gold:
          description: The gold credited to the member's wallet. 0 on an item-only letter.
          format: int64
          minimum: 0
          type: integer
        itemIds:
          description: The item instances now in the member's stash, one per enclosed item and quantity. Empty on a gold-only letter.
          items:
            format: uuid
            type: string
          type: array
        letterId:
          format: uuid
          type: string
      required:
        - letterId
        - claimState
        - itemIds
        - gold
      type: object
    ConfirmAvatarEnvelope:
      additionalProperties: false
      properties:
        avatar_url:
          description: The stored avatar URL
          type: string
        message:
          description: Message chosen by auth-service
          type: string
        statusCode:
          description: Duplicates the HTTP status
          format: int64
          type: integer
        success:
          description: Whether the operation succeeded
          type: boolean
      required:
        - statusCode
        - message
        - success
        - avatar_url
      type: object
    ConfirmAvatarUploadBody:
      additionalProperties: false
      properties:
        upload_id:
          description: The upload_id returned by the upload request
          type: string
      required:
        - upload_id
      type: object
    ConsumableDetail:
      additionalProperties: false
      properties:
        base_buy_price:
          format: int32
          type: integer
        base_sell_price:
          format: int32
          type: integer
        buff_duration:
          format: int32
          type: integer
        created_at:
          $ref: "#/components/schemas/Timestamp"
        description:
          type: string
        healing_amount:
          format: int32
          type: integer
        icon_url:
          type: string
        id:
          type: string
        item_code:
          type: string
        item_name:
          type: string
        item_template_id:
          type: string
        mana_amount:
