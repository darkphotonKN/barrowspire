          type: string
        rarity_id:
          description: Rarity id
          type: string
        weapon_type:
          description: Weapon type
          type: string
      type: object
    Enclosure:
      additionalProperties: false
      properties:
        gold:
          description: The gold amount. Present on a gold enclosure.
          format: int64
          type: integer
        item:
          $ref: "#/components/schemas/ItemSnapshot"
          description: The item as it was when the letter was sent. Present on an item enclosure.
        kind:
          enum:
            - item
            - gold
          type: string
        quantity:
          description: How many of the item. Present on an item enclosure.
          format: int32
          type: integer
      required:
        - kind
      type: object
    EnclosureRequest:
      additionalProperties: false
      properties:
        copyOf:
          description: "copy: the item instance to copy as it stands now."
          format: uuid
          type: string
        gold:
          description: "gold: at least 1 (notification-service decides)."
          format: int64
          type: integer
        itemLevel:
          description: "template: at least 1; absent means the template's minimum item level."
          format: int32
          type: integer
        kind:
          enum:
            - template
            - copy
            - gold
          type: string
        quantity:
          description: "template, copy: 1-60 (notification-service decides)."
          format: int32
          type: integer
        templateId:
          description: "template: the item template."
          format: uuid
          type: string
      required:
        - kind
      type: object
    Entry:
      additionalProperties: false
      properties:
        account_id:
          type: string
        amount:
          format: int64
          type: integer
        created_at:
          format: date-time
          type: string
        direction:
          type: string
        id:
          type: string
        transaction_id:
          type: string
      required:
        - id
        - transaction_id
        - account_id
        - amount
        - direction
        - created_at
      type: object
    EntryPage:
      additionalProperties: false
      properties:
        entries:
          items:
            $ref: "#/components/schemas/Entry"
          type:
            - array
