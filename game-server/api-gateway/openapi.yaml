        players:
          description: Ranked players
          items:
            $ref: "#/components/schemas/PlayerRankingStats"
          type:
            - array
            - "null"
        total_count:
          description: Total ranked players
          format: int32
          type: integer
      type: object
    Leg:
      additionalProperties: false
      properties:
        account_id:
          type: string
        amount:
          format: int64
          type: integer
        direction:
          type: string
      required:
        - account_id
        - amount
        - direction
      type: object
    Letter:
      additionalProperties: false
      properties:
        body:
          description: Plain text.
          type: string
        claimState:
          description: none on a letter without enclosures; treat claiming like unclaimed.
          enum:
            - none
            - unclaimed
            - claiming
            - claimed
          type: string
        enclosures:
          description: Empty on a letter without enclosures.
          items:
            $ref: "#/components/schemas/Enclosure"
          type: array
        expiresAt:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        read:
          type: boolean
        sender:
          description: "official: the Barrowspire Wardens; system: the Spire."
          enum:
            - official
            - system
          type: string
        sentAt:
          format: date-time
          type: string
        title:
          type: string
      required:
        - id
        - title
        - body
        - sender
        - sentAt
        - expiresAt
        - read
        - claimState
        - enclosures
      type: object
    LetterList:
      additionalProperties: false
      properties:
        letters:
          description: At most 50 non-expired letters, newest first.
          items:
            $ref: "#/components/schemas/Letter"
          type: array
      required:
        - letters
      type: object
    ListEnvelope:
      additionalProperties: false
      properties:
        message:
          description: Human-readable summary
          type: string
        notifications:
          description: The member's notifications
          items:
            $ref: "#/components/schemas/Notification"
          type:
            - array
            - "null"
        statusCode:
          description: Duplicates the HTTP status
          format: int64
          type: integer
        total:
          description: Total notifications available
          format: int32
          type: integer
      required:
        - statusCode
        - message
        - notifications
        - total
      type: object
    ListItemInstancesResponse:
      additionalProperties: false
