components:
  schemas:
    AcceptedEnvelope:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/AcceptedEnvelope.json
          format: uri
          readOnly: true
          type: string
        message:
          description: Human-readable summary
          type: string
        statusCode:
          description: Duplicates the HTTP status
          format: int64
          type: integer
      required:
        - statusCode
        - message
      type: object
    AvatarUploadEnvelope:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/AvatarUploadEnvelope.json
          format: uri
          readOnly: true
          type: string
        message:
          description: Human-readable summary
          type: string
        result:
          $ref: "#/components/schemas/AvatarUploadResult"
          description: Presigned upload details
        statusCode:
          description: Duplicates the HTTP status
          format: int64
          type: integer
      required:
        - statusCode
        - message
        - result
      type: object
    AvatarUploadResult:
      additionalProperties: false
      properties:
        allowed_content_types:
          description: Accepted content types
          items:
            type: string
          type:
            - array
            - "null"
        expires_at:
          $ref: "#/components/schemas/Timestamp"
          description: Presigned URL expiry
        max_file_size:
          description: Maximum accepted size in bytes
          format: int64
          type: integer
        presigned_url:
          description: S3 URL to PUT the file to
          type: string
        s3_key:
          description: Object key
          type: string
        upload_id:
          description: Correlates the request with its confirmation
          type: string
      type: object
    CheckEmailEnvelope:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CheckEmailEnvelope.json
          format: uri
          readOnly: true
          type: string
        exists:
          description: Whether an account already uses this email
          type: boolean
        statusCode:
          description: Duplicates the HTTP status
          format: int64
          type: integer
      required:
        - statusCode
        - exists
      type: object
    ConfirmAvatarEnvelope:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ConfirmAvatarEnvelope.json
          format: uri
          readOnly: true
          type: string
        avatar_url:
          description: The stored avatar URL
          type: string
        message:
          description: Message chosen by auth-service
          type: string
        statusCode:
          description: Duplicates the HTTP status
          format: int64
          type: integer
        success:
          description: Whether the operation succeeded
          type: boolean
      required:
        - statusCode
        - message
        - success
        - avatar_url
      type: object
    ConfirmAvatarUploadBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ConfirmAvatarUploadBody.json
          format: uri
          readOnly: true
          type: string
        upload_id:
          description: The upload_id returned by the upload request
          type: string
      required:
        - upload_id
      type: object
    FieldError:
      additionalProperties: false
      properties:
        field:
          type: string
        message:
          type: string
      required:
        - field
        - message
      type: object
    LoginEnvelope:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/LoginEnvelope.json
          format: uri
          readOnly: true
          type: string
        message:
          description: Human-readable summary
          type: string
        result:
          $ref: "#/components/schemas/LoginResult"
          description: Tokens and member info
        statusCode:
          description: Duplicates the HTTP status
          format: int64
          type: integer
      required:
        - statusCode
        - message
        - result
      type: object
    LoginResult:
      additionalProperties: false
      properties:
        access_expires_in:
          description: Access token lifetime in seconds
          format: int32
          type: integer
        access_token:
          description: Bearer token for the Authorization header
          type: string
        member_info:
          $ref: "#/components/schemas/Member"
          description: The signed-in member
        refresh_expires_in:
          description: Refresh token lifetime in seconds
          format: int32
          type: integer
        refresh_token:
          description: Refresh token
          type: string
      type: object
    Member:
      additionalProperties: false
      properties:
        avatar_url:
          description: Avatar URL, empty when unset
          type: string
        average_rating:
          description: Average rating
          format: float
          type: number
        created_at:
          $ref: "#/components/schemas/Timestamp"
          description: Creation time
        email:
          description: Email address
          type: string
        id:
          description: Member id (UUID)
          type: string
        name:
          description: Display name
          type: string
        role:
          description: Member role
          type: string
        status:
          description: Account status code as stored by auth-service
          format: int32
          type: integer
        updated_at:
          $ref: "#/components/schemas/Timestamp"
          description: Last update time
      type: object
    MemberEnvelope:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/MemberEnvelope.json
          format: uri
          readOnly: true
          type: string
        message:
          description: Human-readable summary
          type: string
        result:
          $ref: "#/components/schemas/Member"
          description: The member
        statusCode:
          description: Duplicates the HTTP status
          format: int64
          type: integer
      required:
        - statusCode
        - message
        - result
      type: object
    RequestAvatarUploadBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/RequestAvatarUploadBody.json
          format: uri
          readOnly: true
          type: string
        filename:
          description: Name of the file to upload
          type: string
      type: object
    SeamError:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/SeamError.json
          format: uri
          readOnly: true
          type: string
        code:
          type: string
        detail:
          type: string
        errors:
          items:
            $ref: "#/components/schemas/FieldError"
          type:
            - array
            - "null"
        status:
          format: int64
          type: integer
        title:
          type: string
        type:
          type: string
      required:
        - type
        - title
        - status
        - detail
        - code
        - errors
      type: object
    SigninBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/SigninBody.json
          format: uri
          readOnly: true
          type: string
        email:
          description: Email address
          type: string
        password:
          description: Plaintext password
          type: string
      type: object
    SignupBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/SignupBody.json
          format: uri
          readOnly: true
          type: string
        email:
          description: Email address
          type: string
        name:
          description: Display name
          type: string
        password:
          description: Plaintext password
          type: string
      type: object
    SuccessEnvelope:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/SuccessEnvelope.json
          format: uri
          readOnly: true
          type: string
        message:
          description: Message chosen by auth-service
          type: string
        statusCode:
          description: Duplicates the HTTP status
          format: int64
          type: integer
        success:
          description: Whether the operation succeeded
          type: boolean
      required:
        - statusCode
        - message
        - success
      type: object
    Timestamp:
      additionalProperties: false
      properties:
        nanos:
          description: Nanosecond offset within the second
          format: int32
          type: integer
        seconds:
          description: Seconds since the Unix epoch
          format: int64
          type: integer
      type: object
    UpdateInfoBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/UpdateInfoBody.json
          format: uri
          readOnly: true
          type: string
        name:
          description: New display name
          type: string
        status:
          description: New status
          type: string
      type: object
    UpdatePasswordBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/UpdatePasswordBody.json
          format: uri
          readOnly: true
          type: string
        current_password:
          description: Current password
          type: string
        new_password:
          description: New password
          type: string
        repeat_new_password:
          description: New password, repeated
          type: string
      type: object
info:
  description: HTTP surface of the barrowspire gateway. Errors are RFC 9457 problem+json carrying a stable `code`; clients switch on `code`, never on `detail`.
  title: barrowspire gateway
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/member:
    get:
      description: Returns the member identified by the bearer token. Identity never comes from the request.
      operationId: get-member
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberEnvelope"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Unauthorized
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Not Found
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Internal Server Error
      summary: Get the signed-in member
      tags:
        - member
  /api/member/avatar/confirm:
    post:
      description: Confirms a previously requested avatar upload completed, and returns the stored avatar URL.
      operationId: confirm-avatar-upload
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmAvatarUploadBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmAvatarEnvelope"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Unauthorized
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Internal Server Error
      summary: Confirm an avatar upload completed
      tags:
        - member
  /api/member/avatar/upload-request:
    post:
      description: Returns a presigned S3 URL to PUT an avatar to, plus the constraints the upload must satisfy.
      operationId: request-avatar-upload
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestAvatarUploadBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvatarUploadEnvelope"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Unauthorized
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Internal Server Error
      summary: Get a presigned URL for an avatar upload
      tags:
        - member
  /api/member/check-email:
    get:
      description: "Signup's polling companion: signup returns 202 without creating the account, and this reports when it exists."
      operationId: check-email-exists
      parameters:
        - description: Email address to check
          explode: false
          in: query
          name: email
          schema:
            description: Email address to check
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckEmailEnvelope"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Bad Request
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Internal Server Error
      summary: Check whether an email is already registered
      tags:
        - member
  /api/member/signin:
    post:
      description: Returns an access token, a refresh token, and the member. A wrong password and an unknown email are deliberately indistinguishable.
      operationId: signin
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SigninBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginEnvelope"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Unauthorized
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Internal Server Error
      summary: Sign in and receive tokens
      tags:
        - member
  /api/member/signup:
    post:
      description: Publishes a signup command and returns immediately. The account is NOT created by the time this responds — poll check-email to observe it.
      operationId: signup
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupBody"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedEnvelope"
          description: Accepted
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Service Unavailable
      summary: Request a new member account
      tags:
        - member
  /api/member/update-info:
    patch:
      description: Updates the signed-in member's display name and status, and returns the updated member.
      operationId: update-member-info
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInfoBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberEnvelope"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Unauthorized
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Internal Server Error
      summary: Update the signed-in member's profile
      tags:
        - member
  /api/member/update-password:
    patch:
      description: Changes the signed-in member's password. The current password is verified by auth-service.
      operationId: update-member-password
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePasswordBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Unauthorized
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Internal Server Error
      summary: Change the signed-in member's password
      tags:
        - member
tags:
  - description: Member accounts, authentication, and profile
    name: member
