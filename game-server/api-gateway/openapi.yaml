      required:
        - item_name
        - item_code
        - type_id
        - rarity_id
        - item_type
        - item_id
      type: object
    CreateListingBody:
      additionalProperties: false
      properties:
        buyoutPrice:
          description: Gold that buys the item outright and ends the auction. Optional; when set it must be above startPrice.
          format: int64
          minimum: 1
          type: integer
        endsAt:
          description: When the auction closes. Must be in the future.
          format: date-time
          type: string
        itemId:
          description: The item to list. It must be in the seller's stash and not already listed.
          format: uuid
          type: string
        startPrice:
          description: Gold the first bid must meet.
          format: int64
          minimum: 1
          type: integer
      required:
        - itemId
        - startPrice
        - endsAt
      type: object
    CreateWeaponBody:
      additionalProperties: false
      properties:
        attack_power:
          description: Attack power
