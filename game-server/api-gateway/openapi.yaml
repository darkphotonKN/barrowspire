info:
  description: HTTP surface of the barrowspire gateway. Errors are RFC 9457 problem+json carrying a stable `code`; clients switch on `code`, never on `detail`.
  title: barrowspire gateway
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/items/complete-armor:
    post:
      description: Creates the armor and its item template in one request and notifies admins.
      operationId: create-complete-armor
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCompleteArmorBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultEnvelopeArmorDetail"
          description: Created
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Unauthorized
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Internal Server Error
      summary: Create armor and its template together
      tags:
        - items
  /api/items/complete-consumable:
    post:
      description: Creates the consumable and its item template in one request and notifies admins.
      operationId: create-complete-consumable
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCompleteConsumableBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultEnvelopeConsumableDetail"
          description: Created
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Unauthorized
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Internal Server Error
      summary: Create a consumable and its template together
      tags:
        - items
  /api/items/complete-weapon:
    post:
      description: Creates the weapon and its item template in one request and notifies admins.
      operationId: create-complete-weapon
      requestBody:
        content:
          application/json:
