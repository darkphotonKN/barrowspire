          type: integer
        id:
          type: string
        item_level:
          description: The level the item rolled at
          format: int32
          minimum: 1
          type: integer
        item_type:
          description: e.g. weapon, armor, ring, consumable
          type: string
        location:
          description: "Where the member keeps the item: carried in the bag or stored in the town stash. A worn item is in the loadout whatever this says"
          enum:
            - bag
            - stash
          type: string
        magic_resistance:
          format: int32
          type: integer
        mana_amount:
          format: int32
          type: integer
        name:
          type: string
        owner_member_id:
          type: string
        rarity_id:
          type: string
        required_level:
          description: "Derived requirement: max of base and affix tiers; the template's for items from before item levels"
          format: int32
          minimum: 1
          type: integer
        sell_price:
          format: int32
          type: integer
        source:
          type: string
        status:
          description: Lifecycle status; only AVAILABLE relics can be listed or equipped. IN_RUN is checked out into a run or field world.
          enum:
            - AVAILABLE
            - LISTED
            - IN_ESCROW
            - PENDING_SETTLEMENT
            - IN_RUN
          type: string
        template_id:
          type: string
        unique_effect:
          description: The unique's effect text. Absent unless the item is a unique
          type: string
        weapon_type:
          type: string
      required:
        - item_level
        - affixes
        - location
      type: object
    ItemRarity:
