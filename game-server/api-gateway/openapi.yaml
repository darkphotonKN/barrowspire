  /api/member/email:
    put:
      description: "Changes the signed-in member's email while it is unverified, and mails a code to the new address. The current address behaves as a resend. An address already in use, compared case-insensitively, answers 409. Refusals: EMAIL_INVALID, EMAIL_ALREADY_VERIFIED, VERIFICATION_RESEND_TOO_SOON (within 60 seconds of the last code)."
      operationId: change-email
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeEmailBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Unauthorized
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Service Unavailable
      security:
        - bearerAuth: []
      summary: Change an unverified email
      tags:
        - member
  /api/member/email/resend:
    post:
      description: "Mails the signed-in member a new verification code; the previous one stops working. Refusals: VERIFICATION_RESEND_TOO_SOON (within 60 seconds of the last code), EMAIL_ALREADY_VERIFIED."
      operationId: resend-verification
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Unauthorized
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Service Unavailable
      security:
        - bearerAuth: []
      summary: Resend the verification code
      tags:
        - member
  /api/member/email/verify:
    post:
      description: "Verifies the signed-in member's email with the code mailed to them, and returns a fresh token pair whose access token carries the email-verified claim. An already-verified member gets a fresh pair too, whatever code is sent. Refusals: VERIFICATION_CODE_INVALID (wrong code; the 5th wrong try burns it), VERIFICATION_CODE_EXPIRED (no live code: never issued, expired, or burned)."
      operationId: verify-email
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Unauthorized
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Service Unavailable
      security:
        - bearerAuth: []
      summary: Verify the signed-in member's email
      tags:
        - member
  /api/member/refresh:
    post:
      description: "Takes the refresh token from sign-in or verification and returns a new access token, minted from the member as they are now, with that member. No refresh token is returned: keep the one you hold; it stays valid until its own expiry. An expired, invalid or wrong-type token, or one naming no member, answers 401 UNAUTHENTICATED, one code for every cause."
      operationId: refresh-access-token
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshBody"
        required: true
      responses:
        "200":
