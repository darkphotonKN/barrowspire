  /api/stats/leaderboard:
    get:
      description: Public. Returns ranked players. limit defaults to 50 and may not exceed it.
      operationId: get-leaderboard
      parameters:
        - description: Rows to return, 0-50
          explode: false
          in: query
          name: limit
          schema:
            default: 50
            description: Rows to return, 0-50
            format: int32
            type: integer
        - description: Rows to skip
          explode: false
          in: query
          name: offset
          schema:
            default: 0
            description: Rows to skip
            format: int32
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Leaderboard"
          description: OK
        "400":
          content:
            application/problem+json:
