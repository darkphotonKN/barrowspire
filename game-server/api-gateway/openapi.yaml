          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultEnvelopeWeaponDetail"
          description: Created
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Unauthorized
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Internal Server Error
      summary: Create a weapon and its template together
      tags:
        - items
  /api/items/instances:
    get:
      description: "The member's stash: every item instance they own."
      operationId: list-item-instances
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultEnvelopeListItemInstancesResponse"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Unauthorized
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Internal Server Error
      summary: List the signed-in member's item instances
      tags:
        - items
  /api/items/loadout:
    get:
      description: Returns the equipped item in each loadout slot.
      operationId: get-loadout
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultEnvelopeGetLoadoutResponse"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Unauthorized
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Internal Server Error
      summary: Get the signed-in member's loadout
      tags:
        - items
    put:
      description: Sets the item instance in a slot. An empty item_instance_id unequips the slot.
      operationId: update-loadout
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLoadoutBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultEnvelopeUpdateLoadoutResponse"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Unauthorized
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Internal Server Error
      summary: Equip or unequip an item in a loadout slot
      tags:
        - items
