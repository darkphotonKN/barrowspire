          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SeamError"
          description: Service Unavailable
      security:
        - bearerAuth: []
      summary: Get one of my characters
      tags:
        - characters
