version: "3.9"
services:
  barrowspire-consul:
    image: hashicorp/consul
    container_name: barrowspire-consul
    command: agent -server -ui -node=server-1 -bootstrap-expect=1 -client=0.0.0.0
    ports:
      - 8623:8500 # Changed from 8500 to avoid conflicts
      - 8723:8600/udp # Changed from 8600 to avoid conflicts
    volumes:
      - barrowspire-consul-data:/consul/data
    networks:
      - barrowspire-network

  barrowspire-rabbitmq:
    image: "rabbitmq:3-management"
    container_name: barrowspire-rabbitmq
    ports:
      - "15795:15672" # Changed from 15672 to avoid conflicts
      - "5795:5672" # Changed from 5672 to avoid conflicts
    environment:
      - RABBITMQ_DEFAULT_USER=barrowspire
      - RABBITMQ_DEFAULT_PASS=barrowspire
    volumes:
      - barrowspire-rabbitmq-data:/var/lib/rabbitmq
    networks:
      - barrowspire-network

  redis:
    image: redis:7-alpine
    container_name: barrowspire-redis
    ports:
      - "6492:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - barrowspire-network

  # Auth Service Database
  auth-service-db:
    image: postgres:17
    container_name: barrowspire_auth_service_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: barrowspire_auth_service_db
    ports:
      - "5216:5432"
    volumes:
      - barrowspire_auth_service_pgdata:/var/lib/postgresql/data
    networks:
      - barrowspire-network

  # Game Service Database
  game-service-db:
    image: postgres:17
    container_name: barrowspire_game_service_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: barrowspire_game_service_db
    ports:
      - "5143:5432"
    volumes:
      - barrowspire_game_service_pgdata:/var/lib/postgresql/data
    networks:
      - barrowspire-network

  # Stats Service Database
  stats-service-db:
    image: postgres:17
    container_name: barrowspire_stats_service_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: barrowspire_stats_service_db
    ports:
      - "5223:5432"
    volumes:
      - barrowspire_stats_service_pgdata:/var/lib/postgresql/data
    networks:
      - barrowspire-network

  # Items Service Database
  items-service-db:
    image: postgres:17
    container_name: barrowspire_items_service_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: barrowspire_items_service_db
    ports:
      - "5217:5432"
    volumes:
      - barrowspire_items_service_pgdata:/var/lib/postgresql/data
    networks:
      - barrowspire-network

  # Notification Service Database
  notification-service-db:
    image: postgres:17
    container_name: barrowspire_notification_service_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: barrowspire_notification_service_db
    ports:
      - "5214:5432"
    volumes:
      - barrowspire_notification_service_pgdata:/var/lib/postgresql/data
    networks:
      - barrowspire-network

  # API Gateway Database
  api-gateway-db:
    image: postgres:17
    container_name: barrowspire_api_gateway_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: barrowspire_api_gateway_db
    ports:
      - "5220:5432"
    volumes:
      - barrowspire_api_gateway_pgdata:/var/lib/postgresql/data
    networks:
      - barrowspire-network

  # Marketplace Service Database
  marketplace-service-db:
    image: postgres:17
    container_name: barrowspire_marketplace_service_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: barrowspire_marketplace_service_db
    ports:
      - "5224:5432"
    volumes:
      - barrowspire_marketplace_service_pgdata:/var/lib/postgresql/data
    networks:
      - barrowspire-network

  # Wallet Service Database
  wallet-service-db:
    image: postgres:17
    container_name: barrowspire_wallet_service_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: barrowspire_wallet_service_db
    ports:
      - "5225:5432"
    volumes:
      - barrowspire_wallet_service_pgdata:/var/lib/postgresql/data
    networks:
      - barrowspire-network

  # Ledger Service Database
  ledger-service-db:
    image: postgres:17
    container_name: barrowspire_ledger_service_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: barrowspire_ledger_service_db
    ports:
      - "5226:5432"
    volumes:
      - barrowspire_ledger_service_pgdata:/var/lib/postgresql/data
  # Character Service Database
  character-service-db:
    image: postgres:17
    container_name: barrowspire_character_service_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: barrowspire_character_service_db
    ports:
      - "5218:5432"
    volumes:
      - barrowspire_character_service_pgdata:/var/lib/postgresql/data
    networks:
      - barrowspire-network

  # ---------------------------------------------------------------------------
  # Temporal — durable execution for the settlement saga (ADR-0011).
  #
  # Built from temporalio/server + temporalio/admin-tools, NOT temporalio/auto-setup:
  # that image stopped being published after 1.29.7. The cost is that schema
  # creation is an explicit init container instead of implicit on boot, and that
  # the server config is an authored file (./temporal/config) rather than env
  # vars rendered from a template — which is also what a real deployment does.
  #
  # Ports follow the repo's offset convention:
  #   5233 -> Temporal's Postgres
  #   7233 -> Temporal frontend (gRPC)
  #   8233 -> Temporal UI
  # ---------------------------------------------------------------------------

  # Temporal's own Postgres. Deliberately NOT a database inside a service's
  # instance: Temporal runs its own migrations on its own cadence, and sharing
  # means a Temporal schema upgrade can take a service DB down with it.
  temporal-db:
    image: postgres:17
    container_name: barrowspire_temporal_db
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: postgres
    ports:
      - "5233:5432"
    volumes:
      - barrowspire_temporal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - barrowspire-network

  # One-shot: create the two databases and install/upgrade their schemas.
  # Runs to completion, then exits. Everything downstream gates on that exit.
  # Idempotent — safe to re-run on every `up`.
  temporal-setup:
    image: temporalio/admin-tools:${TEMPORAL_VERSION:-1.32.0}
    container_name: barrowspire_temporal_setup
    depends_on:
      temporal-db:
        condition: service_healthy
    # The image is busybox-based: /bin/bash does not exist.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        SQL="temporal-sql-tool --plugin postgres12 --ep temporal-db -p 5432 -u temporal --pw temporal"

        echo "==> creating databases"
        $${SQL} --db temporal create-database || true
        $${SQL} --db temporal_visibility create-database || true

        echo "==> main schema"
        $${SQL} --db temporal setup-schema -v 0.0
        $${SQL} --db temporal update-schema \
          -d /etc/temporal/schema/postgresql/v12/temporal/versioned

        echo "==> visibility schema"
        $${SQL} --db temporal_visibility setup-schema -v 0.0
        $${SQL} --db temporal_visibility update-schema \
          -d /etc/temporal/schema/postgresql/v12/visibility/versioned

        echo "==> schema ready"
    networks:
      - barrowspire-network

  # The server itself. numHistoryShards lives in ./temporal/config/development.yaml
  # and is fixed for the life of the cluster.
  temporal:
    image: temporalio/server:${TEMPORAL_VERSION:-1.32.0}
    container_name: barrowspire_temporal
    depends_on:
      temporal-setup:
        condition: service_completed_successfully
    environment:
      TEMPORAL_ROOT: /etc/temporal
      TEMPORAL_CONFIG_DIR: config
      TEMPORAL_ENVIRONMENT: development
    volumes:
      - ./temporal/config:/etc/temporal/config:ro
      - ./temporal/dynamicconfig:/etc/temporal/dynamicconfig:ro
    ports:
      - "7233:7233"
    healthcheck:
      # The server image carries temporal-server only, not the temporal CLI, so
      # the check is a plain TCP probe of the frontend's own port.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 7233"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - barrowspire-network

  # One-shot: create the barrowspire namespace.
  # Retention is set at creation and is awkward to change later — 7 days, not
  # the 1-day minimum, because reading last week's histories is the point.
  temporal-namespace:
    image: temporalio/admin-tools:${TEMPORAL_VERSION:-1.32.0}
    container_name: barrowspire_temporal_namespace
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        until temporal operator cluster health >/dev/null 2>&1; do
          echo "waiting for frontend..."; sleep 2
        done
        if temporal operator namespace describe --namespace barrowspire >/dev/null 2>&1; then
          echo "namespace barrowspire already exists"
        else
          temporal operator namespace create --namespace barrowspire --retention 7d
          echo "namespace barrowspire created"
        fi
    networks:
      - barrowspire-network

  temporal-ui:
    image: temporalio/ui:${TEMPORAL_UI_VERSION:-2.34.0}
    container_name: barrowspire_temporal_ui
    depends_on:
      temporal:
        condition: service_started
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_UI_PORT: 8080
      TEMPORAL_DEFAULT_NAMESPACE: barrowspire
    ports:
      # The UI's container port stays 8080; only the host mapping moves.
      - "8233:8080"
    networks:
      - barrowspire-network

networks:
  barrowspire-network:
    name: barrowspire-network

volumes:
  barrowspire-consul-data:
  barrowspire-rabbitmq-data:
  redis_data:
  barrowspire_auth_service_pgdata:
  barrowspire_game_service_pgdata:
  barrowspire_stats_service_pgdata:
  barrowspire_items_service_pgdata:
  barrowspire_notification_service_pgdata:
  barrowspire_api_gateway_pgdata:
  barrowspire_marketplace_service_pgdata:
  barrowspire_wallet_service_pgdata:
  barrowspire_ledger_service_pgdata:
  barrowspire_character_service_pgdata:
  barrowspire_temporal_pgdata:
